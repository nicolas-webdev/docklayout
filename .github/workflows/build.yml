name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift run DockLayoutChecks

      - name: Versions match
        run: |
          swift_version="$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/DockLayoutCore/Version.swift)"
          npm_version="$(node -p 'require("./package.json").version')"
          [[ "$swift_version" == "$npm_version" ]] || { echo "Version.swift $swift_version vs package.json $npm_version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "v$swift_version" == "$GITHUB_REF_NAME" ]] || { echo "Tag $GITHUB_REF_NAME vs version $swift_version"; exit 1; }
          fi

      - name: Build app
        run: scripts/build-app.sh

      - name: Smoke test the bundled CLI
        run: |
          "dist/Dock Layout.app/Contents/Helpers/docklayout" --version
          "dist/Dock Layout.app/Contents/MacOS/DockLayout" --debug-menu
          lipo -archs "dist/Dock Layout.app/Contents/MacOS/DockLayout"

      - name: Make DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DockLayout
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes
