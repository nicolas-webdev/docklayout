name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/build-app.sh

      - name: Smoke test the bundled CLI
        run: |
          "dist/Dock Layout.app/Contents/Helpers/docklayout" --version
          "dist/Dock Layout.app/Contents/MacOS/DockLayout" --debug-menu
          lipo -archs "dist/Dock Layout.app/Contents/MacOS/DockLayout"

      - name: Make DMG
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DockLayout
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes
